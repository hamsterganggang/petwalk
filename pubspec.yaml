name: petwalk
description: "PetWalk - A Flutter app for pet walking management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase packages
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8
  
  # Google Sign-In
  google_sign_in: ^6.2.2
  
  # Image picker for profile photo
  image_picker: ^1.0.7
  
  # Permission handler for location
  permission_handler: ^11.3.0
  
  # State management
  provider: ^6.1.1

  # Map and Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2

  # UI and Charts
  fl_chart: ^0.70.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Paperlogy
      fonts:
        - asset: fonts/Paperlogy-1Thin.ttf
          weight: 100
        - asset: fonts/Paperlogy-2ExtraLight.ttf
          weight: 200
        - asset: fonts/Paperlogy-3Light.ttf
          weight: 300
        - asset: fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: fonts/Paperlogy-5Medium.ttf
          weight: 500
        - asset: fonts/Paperlogy-6SemiBold.ttf
          weight: 600
        - asset: fonts/Paperlogy-7Bold.ttf
          weight: 700
        - asset: fonts/Paperlogy-8ExtraBold.ttf
          weight: 800
        - asset: fonts/Paperlogy-9Black.ttf
          weight: 900
